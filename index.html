<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="提詞器">
<meta name="theme-color" content="#111214">
<title>浮動提詞器</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --text: #1b1c1e;
    --muted: #6b6e74;
    --line: #e2e2de;
    --accent: #e8542f;
    --accent-text: #ffffff;
    --soft: #f0efeb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111214;
      --card: #1b1c1f;
      --text: #f2f2f0;
      --muted: #9a9ca2;
      --line: #2c2d31;
      --accent: #ff6a43;
      --accent-text: #ffffff;
      --soft: #24252a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111214; --card: #1b1c1f; --text: #f2f2f0; --muted: #9a9ca2;
    --line: #2c2d31; --accent: #ff6a43; --accent-text: #ffffff; --soft: #24252a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: .5px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .step { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 17px; font-weight: 600; }
  .num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-size: 14px; flex: none;
  }
  textarea {
    width: 100%; min-height: 200px; resize: vertical;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--soft); color: var(--text);
    padding: 12px; font: inherit; font-size: 16px; line-height: 1.6;
  }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .row { margin: 14px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
  .row label b { font-variant-numeric: tabular-nums; color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1 1 0; min-width: 64px;
    padding: 9px 8px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--soft); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  canvas#preview, video#player {
    width: 100%; display: block; border-radius: 12px; background: #000;
    border: 1px solid var(--line);
  }
  .big {
    width: 100%; padding: 15px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .big:disabled { opacity: .5; }
  .ghost {
    width: 100%; padding: 12px; border-radius: 14px; margin-top: 8px;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    font: inherit; font-size: 15px; cursor: pointer; text-align: center; text-decoration: none; display: block;
  }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }
  .hidden { display: none !important; }
  .tips { font-size: 14px; color: var(--muted); padding-left: 20px; margin: 8px 0 0; }
  .tips li { margin: 4px 0; }
  details summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>浮動提詞器</h1>
  <p class="sub">把腳本變成「畫中畫」浮動視窗，切到相機錄影時一樣看得到。提詞文字不會被錄進影片。</p>

  <section class="card">
    <h2 class="step"><span class="num">1</span>貼上腳本</h2>
    <textarea id="script" placeholder="把你的口播稿貼在這裡…"></textarea>
    <div class="meta"><span id="count">0 字</span><span id="est">預估 0 秒</span></div>
  </section>

  <section class="card">
    <h2 class="step"><span class="num">2</span>調整文字與速度</h2>
    <canvas id="preview"></canvas>

    <div class="row">
      <label>文字大小 <b id="fsV"></b></label>
      <input type="range" id="fs" min="40" max="140" step="2">
    </div>
    <div class="row">
      <label>捲動速度（每秒幾個字） <b id="cpsV"></b></label>
      <input type="range" id="cps" min="1.5" max="9" step="0.25">
    </div>
    <div class="row">
      <label>浮動視窗形狀</label>
      <div class="seg" data-key="ratio">
        <button data-v="2:1">扁長 2:1</button>
        <button data-v="16:9">16:9</button>
        <button data-v="4:3">4:3</button>
      </div>
    </div>
    <div class="row">
      <label>配色</label>
      <div class="seg" data-key="theme">
        <button data-v="wb">白字黑底</button>
        <button data-v="yb">黃字黑底</button>
        <button data-v="bw">黑字白底</button>
      </div>
    </div>
    <div class="row">
      <label>對齊</label>
      <div class="seg" data-key="align">
        <button data-v="left">靠左</button>
        <button data-v="center">置中</button>
      </div>
    </div>
    <div class="row">
      <label>開始前倒數</label>
      <div class="seg" data-key="lead">
        <button data-v="0">不倒數</button>
        <button data-v="3">3 秒</button>
        <button data-v="5">5 秒</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="step"><span class="num">3</span>產生提詞影片</h2>
    <button class="big" id="make">產生提詞影片</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="playCard">
    <h2 class="step"><span class="num">4</span>開啟浮動視窗，去錄影</h2>
    <video id="player" playsinline muted preload="auto" autopictureinpicture></video>
    <div class="row">
      <label>播放速度微調 <b id="rateV">1.0×</b></label>
      <div class="seg" data-key="rate">
        <button data-v="0.75">0.75×</button>
        <button data-v="0.9">0.9×</button>
        <button data-v="1">1×</button>
        <button data-v="1.1">1.1×</button>
        <button data-v="1.25">1.25×</button>
      </div>
    </div>
    <button class="big" id="pip">開啟浮動視窗（畫中畫）</button>
    <a class="ghost" id="dl" download="提詞器.mp4">下載提詞影片</a>
    <ol class="tips">
      <li>浮動視窗出現後，回到主畫面，打開<b>相機 → 錄影 → 前鏡頭</b>。</li>
      <li>把浮動視窗拖到鏡頭正下方，雙指可放大縮小。</li>
      <li>按下錄影後，點浮動視窗裡的 ▶︎ 開始捲動（有倒數）。</li>
      <li>念不完就暫停，或回來改「速度微調」再開一次。</li>
    </ol>
  </section>

  <section class="card">
    <details>
      <summary>為什麼不會錄到提詞文字？</summary>
      <p class="tips" style="padding:0">畫中畫視窗是蓋在螢幕上的系統層，相機錄的是鏡頭畫面，不是螢幕，所以文字不會出現在影片裡，也不用後製剪掉。</p>
    </details>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tp_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('tp_' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const SAMPLE = '大家好，今天想跟你分享一個超實用的小技巧。\n\n很多人拍口播影片的時候，最怕的就是忘詞，一直重拍、一直 NG。\n\n其實只要用這個免費的浮動提詞器，你就可以一邊看著腳本，一邊用 iPhone 相機直接錄影。\n\n而且提詞文字不會被錄進去，錄完就能直接上傳。\n\n如果覺得有幫助，記得收藏起來，下次拍片就用得到！';

  const THEMES = {
    wb: { bg: '#000000', fg: '#ffffff', dim: 'rgba(255,255,255,0.35)', mark: '#ff6a43' },
    yb: { bg: '#000000', fg: '#ffe14d', dim: 'rgba(255,225,77,0.35)', mark: '#ff6a43' },
    bw: { bg: '#ffffff', fg: '#111111', dim: 'rgba(0,0,0,0.3)', mark: '#e8542f' }
  };
  const RATIOS = { '2:1': [960, 480], '16:9': [960, 540], '4:3': [960, 720] };

  const S = {
    script: store.get('script', SAMPLE),
    fs: store.get('fs', 72),
    cps: store.get('cps', 4),
    ratio: store.get('ratio', '2:1'),
    theme: store.get('theme', 'wb'),
    align: store.get('align', 'left'),
    lead: store.get('lead', '3'),
    rate: '1'
  };

  // ---------- Layout & drawing ----------
  const PAD_X = 36;
  const NO_LINE_START = /^[、。，．,.！!？?：:；;」』）)】》〉…—~～]$/;

  function tokenize(p) {
    return p.match(/[A-Za-z0-9À-ɏ'’_\-]+|\s+|./gu) || [];
  }

  function wrap(ctx, text, maxW) {
    const lines = [];
    for (const para of text.replace(/\r/g, '').split('\n')) {
      if (!para.trim()) { lines.push(''); continue; }
      let cur = '';
      for (const tok of tokenize(para)) {
        if (!cur && /^\s+$/.test(tok)) continue;
        const next = cur + tok;
        if (ctx.measureText(next).width <= maxW || !cur || NO_LINE_START.test(tok)) {
          cur = next;
        } else {
          lines.push(cur.replace(/\s+$/, ''));
          cur = /^\s+$/.test(tok) ? '' : tok;
        }
      }
      if (cur) lines.push(cur.replace(/\s+$/, ''));
    }
    while (lines.length && lines[0] === '') lines.shift();
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }

  function charCount(text) { return (text.match(/\S/g) || []).length; }

  function makeLayout(canvas) {
    const [W, H] = RATIOS[S.ratio];
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const font = `600 ${S.fs}px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
    ctx.font = font;
    const lines = wrap(ctx, S.script, W - PAD_X * 2);
    const lh = Math.round(S.fs * 1.35);
    const chars = Math.max(1, charCount(S.script));
    const scrollDur = chars / S.cps;
    const scrollH = Math.max(1, lines.length) * lh;
    const lead = Number(S.lead);
    const tail = 2;
    return {
      W, H, ctx, font, lines, lh, lead, tail, scrollDur,
      speed: scrollH / scrollDur,
      guideY: Math.round(H * 0.3),
      total: lead + scrollDur + tail
    };
  }

  function draw(L, t) {
    const { ctx, W, H, lh, guideY } = L;
    const th = THEMES[S.theme];
    ctx.fillStyle = th.bg;
    ctx.fillRect(0, 0, W, H);

    const st = Math.max(0, Math.min(t - L.lead, L.scrollDur));
    const offset = st * L.speed;
    // first line's center sits on the guide line at offset 0
    const baseY = guideY - offset;

    ctx.font = L.font;
    ctx.textBaseline = 'middle';
    ctx.textAlign = S.align === 'center' ? 'center' : 'left';
    const x = S.align === 'center' ? W / 2 : PAD_X;
    const first = Math.max(0, Math.floor((offset - guideY) / lh) - 1);
    const last = Math.min(L.lines.length - 1, Math.ceil((offset + H - guideY) / lh) + 1);
    for (let i = first; i <= last; i++) {
      const y = baseY + i * lh;
      // lines already read are dimmed
      ctx.fillStyle = y < guideY - lh * 0.6 ? th.dim : th.fg;
      ctx.fillText(L.lines[i], x, y);
    }

    // soft fade top & bottom
    const fade = (y0, y1) => {
      const g = ctx.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0, th.bg); g.addColorStop(1, hexA(th.bg, 0));
      ctx.fillStyle = g; ctx.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0));
    };
    fade(0, Math.round(H * 0.12));
    fade(H, Math.round(H * 0.82));

    // reading marker
    ctx.fillStyle = th.mark;
    ctx.beginPath();
    ctx.moveTo(4, guideY - 14); ctx.lineTo(22, guideY); ctx.lineTo(4, guideY + 14);
    ctx.closePath(); ctx.fill();

    // progress bar
    const p = Math.max(0, Math.min(1, t / L.total));
    ctx.fillStyle = th.dim; ctx.fillRect(0, H - 6, W, 6);
    ctx.fillStyle = th.mark; ctx.fillRect(0, H - 6, W * p, 6);

    // countdown
    if (t < L.lead) {
      const n = Math.ceil(L.lead - t);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath(); ctx.arc(W - 70, 70, 46, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 56px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(n), W - 70, 72);
    }
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  // ---------- Encoding ----------
  const FPS = 30;

  async function encodeWithWebCodecs(canvas, L, onProg) {
    const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');
    const codecs = ['avc1.42001f', 'avc1.4d0028', 'avc1.640028'];
    let config = null;
    for (const codec of codecs) {
      const c = { codec, width: L.W, height: L.H, bitrate: 2_000_000, framerate: FPS, avc: { format: 'avc' } };
      try { if ((await VideoEncoder.isConfigSupported(c)).supported) { config = c; break; } } catch (e) {}
    }
    if (!config) throw new Error('此瀏覽器不支援 H.264 編碼');

    const muxer = new Muxer({
      target: new ArrayBufferTarget(),
      video: { codec: 'avc', width: L.W, height: L.H, frameRate: FPS },
      fastStart: 'in-memory'
    });
    let encErr = null;
    const enc = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => { encErr = e; }
    });
    enc.configure(config);

    const frames = Math.ceil(L.total * FPS);
    const dt = 1e6 / FPS;
    for (let i = 0; i < frames; i++) {
      if (encErr) throw encErr;
      draw(L, i / FPS);
      const f = new VideoFrame(canvas, { timestamp: Math.round(i * dt), duration: Math.round(dt) });
      enc.encode(f, { keyFrame: i % (FPS * 2) === 0 });
      f.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (i % 15 === 0) { onProg(i / frames); await new Promise(r => setTimeout(r, 0)); }
    }
    await enc.flush();
    if (encErr) throw encErr;
    muxer.finalize();
    enc.close();
    onProg(1);
    return new Blob([muxer.target.buffer], { type: 'video/mp4' });
  }

  // Fallback: real-time recording of the canvas (slower — takes as long as the video)
  function encodeRealtime(canvas, L, onProg) {
    return new Promise((resolve, reject) => {
      if (!canvas.captureStream || !window.MediaRecorder) {
        reject(new Error('此瀏覽器不支援影片產生，請更新到 iOS 16.4 以上並使用 Safari'));
        return;
      }
      const type = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
      const rec = new MediaRecorder(canvas.captureStream(FPS), type ? { mimeType: type } : undefined);
      const parts = [];
      rec.ondataavailable = e => e.data.size && parts.push(e.data);
      rec.onstop = () => resolve(new Blob(parts, { type: rec.mimeType || 'video/mp4' }));
      rec.onerror = e => reject(e.error || e);
      const t0 = performance.now();
      const tick = () => {
        const t = (performance.now() - t0) / 1000;
        draw(L, Math.min(t, L.total));
        onProg(t / L.total);
        if (t < L.total) requestAnimationFrame(tick); else rec.stop();
      };
      rec.start(500);
      tick();
    });
  }

  // ---------- UI ----------
  const preview = $('preview');
  const work = document.createElement('canvas');
  let previewLayout = null;

  function refresh() {
    $('fsV').textContent = S.fs;
    $('cpsV').textContent = S.cps + ' 字/秒';
    previewLayout = makeLayout(preview);
    // static preview: show the text right as reading starts
    draw(previewLayout, previewLayout.lead + 0.001);
    const n = charCount(S.script);
    $('count').textContent = n + ' 字';
    const sec = Math.round(previewLayout.total);
    $('est').textContent = '影片長度約 ' + (sec >= 60 ? Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒' : sec + ' 秒');
  }

  $('script').value = S.script;
  $('fs').value = S.fs;
  $('cps').value = S.cps;

  $('script').addEventListener('input', e => { S.script = e.target.value; store.set('script', S.script); refresh(); markStale(); });
  $('fs').addEventListener('input', e => { S.fs = Number(e.target.value); store.set('fs', S.fs); refresh(); markStale(); });
  $('cps').addEventListener('input', e => { S.cps = Number(e.target.value); store.set('cps', S.cps); refresh(); markStale(); });

  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key;
    const sync = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(S[key]))));
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      S[key] = b.dataset.v;
      sync();
      if (key === 'rate') { applyRate(); return; }
      store.set(key, S[key]); refresh(); markStale();
    });
    sync();
  });

  const player = $('player');
  let videoURL = null;
  let stale = false;

  function markStale() {
    if (!videoURL || stale) return;
    stale = true;
    $('status').textContent = '設定已變更，請重新產生提詞影片。';
    $('make').textContent = '重新產生提詞影片';
  }

  function applyRate() {
    player.playbackRate = Number(S.rate);
    player.defaultPlaybackRate = Number(S.rate);
    $('rateV').textContent = Number(S.rate).toFixed(2).replace(/0$/, '') + '×';
  }

  $('make').addEventListener('click', async () => {
    if (!charCount(S.script)) { $('status').textContent = '請先貼上腳本。'; return; }
    const btn = $('make');
    btn.disabled = true;
    const prog = $('prog');
    const onProg = p => { prog.style.width = Math.round(p * 100) + '%'; };
    const L = makeLayout(work);
    const t0 = performance.now();
    try {
      let blob;
      if (window.VideoEncoder && window.VideoFrame) {
        $('status').textContent = '產生中…';
        try {
          blob = await encodeWithWebCodecs(work, L, onProg);
        } catch (e) {
          console.warn(e);
          $('status').textContent = '改用即時錄製模式，需要約 ' + Math.round(L.total) + ' 秒，請保持畫面開啟…';
          blob = await encodeRealtime(work, L, onProg);
        }
      } else {
        $('status').textContent = '即時錄製中，需要約 ' + Math.round(L.total) + ' 秒，請保持畫面開啟…';
        blob = await encodeRealtime(work, L, onProg);
      }
      if (videoURL) URL.revokeObjectURL(videoURL);
      videoURL = URL.createObjectURL(blob);
      player.src = videoURL;
      player.load();
      applyRate();
      $('dl').href = videoURL;
      $('dl').download = '提詞器' + (blob.type.includes('webm') ? '.webm' : '.mp4');
      $('playCard').classList.remove('hidden');
      stale = false;
      btn.textContent = '重新產生提詞影片';
      $('status').textContent = '完成！（' + ((performance.now() - t0) / 1000).toFixed(1) + ' 秒）往下開啟浮動視窗。';
      $('playCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      console.error(e);
      $('status').textContent = '產生失敗：' + (e && e.message ? e.message : e);
    } finally {
      btn.disabled = false;
    }
  });

  player.addEventListener('ratechange', () => {
    // iOS may reset the rate when entering PiP; keep the chosen one
    if (Math.abs(player.playbackRate - Number(S.rate)) > 0.01 && !player.paused) player.playbackRate = Number(S.rate);
  });
  player.addEventListener('play', applyRate);

  $('pip').addEventListener('click', async () => {
    try {
      applyRate();
      if (player.webkitSupportsPresentationMode && typeof player.webkitSetPresentationMode === 'function') {
        player.webkitSetPresentationMode(player.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
      } else if (document.pictureInPictureEnabled) {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await player.requestPictureInPicture();
      } else {
        $('status').textContent = '這個瀏覽器不支援畫中畫，請用 iPhone 的 Safari 開啟。';
      }
    } catch (e) {
      console.error(e);
      $('status').textContent = '無法開啟浮動視窗：' + (e.message || e) + '（可先按一下影片播放再試）';
    }
  });

  refresh();
})();
</script>
</body>
</html>
